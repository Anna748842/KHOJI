
services:
  postgres:
    image: postgres:16
    container_name: learnpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnpath
    ports:
      - "5432:5432"
    volumes:
      - learnpath-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  learnpath-data: